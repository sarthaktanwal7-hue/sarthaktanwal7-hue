<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="120" viewBox="0 0 800 120" fill="none">
  <defs>
    <linearGradient id="rGrad0" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#4fd1ff">
        <animate attributeName="stop-color" values="#4fd1ff;#8b7bff;#4fd1ff" dur="4s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
  </defs>
  <style>
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes glow {
  0%, 100% { opacity: 0.7; }
  50%       { opacity: 1.0; }
}
@keyframes shimmer {
  0%   { stop-color: #8b7bff; }
  50%  { stop-color: #4fd1ff;   }
  100% { stop-color: #8b7bff; }
}
@keyframes barGrow {
  from { transform: scaleY(0); transform-origin: bottom; }
  to   { transform: scaleY(1); transform-origin: bottom; }
}

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}
</style>
  <rect width="800" height="120" rx="18" fill="#0d0e1f" stroke="#2a2650" stroke-width="1.5" />
  <g opacity="0">
    <animate attributeName="opacity" from_="0" to="1" begin="0.20s" dur="0.60s" fill="freeze" />
    <animateTransform attributeName="transform" type="translate" from_="0,16" to="0,0" begin="0.20s" dur="0.60s" fill="freeze" additive="sum" />
    <rect x="20" y="20" width="52" height="52" rx="12" fill="rgba(139,123,255,0.12)" stroke="#8b7bff" stroke-width="1" />
    <text x="46" y="52" text-anchor="middle" font-size="26" font-family="'Space Grotesk', 'Segoe UI', system-ui, sans-serif">✨</text>
    <a href="https://github.com/sarthaktanwal7-hue/sarthaktanwal7-hue" target="_blank">
      <text x="88" y="44" font-family="'Space Grotesk', 'Segoe UI', system-ui, sans-serif" font-size="17" font-weight="700" fill="#eef1ff">sarthaktanwal7-hue</text>
    </a>
    <text x="88" y="66" font-family="'Space Grotesk', 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#9ea8c8">✨ GitHub Profile README</text>
    <circle cx="88" cy="97" r="5" fill="#8b7bff" />
    <text x="98" y="102" font-family="'Space Grotesk', 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#9ea8c8">SVG</text>
    <text x="680" y="102" font-family="'Space Grotesk', 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#9ea8c8" text-anchor="end">★ 0  ⑂ 0</text>
  </g>
