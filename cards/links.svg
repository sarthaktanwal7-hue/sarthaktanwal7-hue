<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="80" viewBox="0 0 800 80" fill="none">
  <defs>
    <linearGradient id="linkGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#4fd1ff">
        <animate attributeName="stop-color" values="#4fd1ff;#8b7bff;#4fd1ff" dur="4s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
  </defs>
  <style>
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes glow {
  0%, 100% { opacity: 0.7; }
  50%       { opacity: 1.0; }
}
@keyframes shimmer {
  0%   { stop-color: #8b7bff; }
  50%  { stop-color: #4fd1ff;   }
  100% { stop-color: #8b7bff; }
}
@keyframes barGrow {
  from { transform: scaleY(0); transform-origin: bottom; }
  to   { transform: scaleY(1); transform-origin: bottom; }
}

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}
</style>
  <rect width="800" height="80" rx="18" fill="#0d0e1f" stroke="#2a2650" stroke-width="1.5" />
